# Gate 2 -- the check that counts.
#
# Gate 1 runs from the pull request's own copy of gate.yml, so on a fork a
# contributor can rewrite it to report success on anything. This workflow's
# definition always comes from the default branch, which is the property the
# banned _target variant of the pull_request event cannot provide: the
# reviewing code cannot be edited by the thing being reviewed. (That variant's
# name is deliberately not spelled here -- a test asserts the literal string
# appears nowhere under .github/, comments included.)
#
# NO SECRETS, still. The three prerequisites this file used to name are now
# built and running: the checkout is proven pristine before anything
# privileged, contributor files are fetched by content hash into a temp
# directory and byte-capped, and eligibility/idempotency/budget are
# implemented in scripts/ci/lib/eligibility.mjs.
#
# Two things must be true before a key is added here, and neither is code:
#
#   A durable ledger must be configured. checkEligibility() refuses to
#   authorise spending without one, so wiring a key without naming a store
#   fails closed rather than quietly spending. The Actions cache does NOT
#   qualify: it is branch-scoped and evicts after 7 idle days, so idling the
#   repository would reset the budget -- a spend attack by itself (F8).
#
#   A hard spend cap must exist on the provider side (F9). Every control here
#   is on the GitHub side of the boundary; the cap is the one that converts
#   "the owner's card is drained" into "the reviewer stops and the owner gets
#   an email". The security spec calls its absence the most instructive miss
#   in its own review.
#
# Also worth doing before the key: set fork-PR approval to "all external
# contributors" (F10), so no fork PR starts gate-1 -- and therefore no
# workflow_run, and no spend -- without a maintainer click.
#
# Two filters that look like controls and are not, stated so nobody adds them
# thinking they help: `branches:` filters the TRIGGERING run's branch, which on
# a fork is an attacker-chosen name; and `workflows:` matches by workflow NAME,
# which a contributor can attach to a different file.
name: gate-2

on:
  workflow_run:
    workflows: [gate-1]
    types: [completed]

# contents: read only. No pull-requests: write, no issues: write -- this tier
# posts nothing, so it needs no writing permission at all.
# checks: write is what lets this post its verdict against the pull request's
# head commit. A workflow_run workflow's own check attaches to the DEFAULT
# BRANCH, so without this the gate can never be a required context: branch
# protection would wait forever for a check that never lands on the PR. A real
# pull request's checks listed only Vercel and gate-1, which is how this was
# found.
#
# Still no secrets, and still no pull-requests: write. This posts a verdict; it
# does not comment, label, approve, or merge.
permissions:
  contents: read
  checks: write

concurrency:
  group: gate-2-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only pull requests, and only when the untrusted gate itself completed.
    # Gate 1's *conclusion* is not trusted as a verdict; it is used only to
    # avoid spending a runner on a run that never produced a diff.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      # The default branch. Never the pull request head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # No `npm ci`. The validator must never need the pull request's
      # dependency tree, because installing it would execute its scripts.
      #
      # Every value reaches the script through the environment and is never
      # interpolated into a shell line: a head repository name is
      # attacker-influenced text, and `${{ }}` in a run body is substituted
      # before the shell sees it.
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/gate-2.mjs
