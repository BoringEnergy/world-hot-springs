name: Security hygiene
on:
  pull_request:
  push:
  schedule:
    - cron: '23 15 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-hygiene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  incident-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Confirm actual CI runtime
        run: node --version
      - name: Check reviewed incident indicators and workflow inventory
        run: python3 -I -S .github/security/check_supply_chain.py
      - name: Audit npm lock 1
        working-directory: "."
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high
